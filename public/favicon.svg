<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <radialGradient id="mantleGrad" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002244;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mane - large fluffy circle -->
  <circle cx="100" cy="70" r="65" fill="url(#mantleGrad)" />
  <!-- Mane highlights -->
  <circle cx="80" cy="45" r="25" fill="#FFB700" opacity="0.6" />
  <circle cx="120" cy="50" r="20" fill="#FFB700" opacity="0.5" />

  <!-- Face -->
  <circle cx="100" cy="95" r="45" fill="#FFD700" />

  <!-- Left ear -->
  <circle cx="55" cy="60" r="18" fill="#FFA500" />
  <circle cx="55" cy="65" r="10" fill="#FFD700" />

  <!-- Right ear -->
  <circle cx="145" cy="60" r="18" fill="#FFA500" />
  <circle cx="145" cy="65" r="10" fill="#FFD700" />

  <!-- Eyes frame (glasses) -->
  <circle cx="75" cy="85" r="16" fill="none" stroke="#333333" stroke-width="3" />
  <circle cx="125" cy="85" r="16" fill="none" stroke="#333333" stroke-width="3" />
  <!-- Bridge -->
  <line x1="91" y1="85" x2="109" y2="85" stroke="#333333" stroke-width="3" />

  <!-- Eyes - bright & confident -->
  <circle cx="75" cy="85" r="8" fill="#333333" />
  <circle cx="77" cy="81" r="3" fill="white" />

  <circle cx="125" cy="85" r="8" fill="#333333" />
  <circle cx="127" cy="81" r="3" fill="white" />

  <!-- Nose -->
  <ellipse cx="100" cy="110" rx="6" ry="8" fill="#FF9800" />

  <!-- Mouth - cheerful smile -->
  <path d="M 95 120 Q 100 128 105 120" stroke="#333333" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Whiskers -->
  <line x1="60" y1="105" x2="40" y2="103" stroke="#333333" stroke-width="1.5" stroke-linecap="round" />
  <line x1="60" y1="115" x2="40" y2="118" stroke="#333333" stroke-width="1.5" stroke-linecap="round" />
  <line x1="140" y1="105" x2="160" y2="103" stroke="#333333" stroke-width="1.5" stroke-linecap="round" />
  <line x1="140" y1="115" x2="160" y2="118" stroke="#333333" stroke-width="1.5" stroke-linecap="round" />

  <!-- Body/Shirt - navy blue -->
  <rect x="45" y="145" width="110" height="80" rx="15" fill="url(#bodyGrad)" />

  <!-- Left arm/hand -->
  <rect x="20" y="160" width="30" height="35" rx="15" fill="#FFD700" />
  <!-- Right arm/hand -->
  <rect x="150" y="160" width="30" height="35" rx="15" fill="#FFD700" />

  <!-- Badge/Logo area on shirt -->
  <rect x="80" y="165" width="40" height="25" rx="3" fill="#FFA500" />
  <text x="100" y="182" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#003366">GW</text>
</svg>
