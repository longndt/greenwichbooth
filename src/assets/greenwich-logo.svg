<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (transparent) -->

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#6B4BA0" stroke-width="16"/>

  <!-- 8 compass arrows pointing outward -->
  <!-- North -->
  <polygon points="100,15 88,45 112,45" fill="#6B4BA0"/>
  <!-- NE -->
  <polygon points="150,35 135,55 152,70" fill="#6B4BA0"/>
  <!-- East -->
  <polygon points="185,100 155,88 155,112" fill="#6B4BA0"/>
  <!-- SE -->
  <polygon points="150,165 135,145 152,130" fill="#6B4BA0"/>
  <!-- South -->
  <polygon points="100,185 112,155 88,155" fill="#6B4BA0"/>
  <!-- SW -->
  <polygon points="50,165 65,145 48,130" fill="#6B4BA0"/>
  <!-- West -->
  <polygon points="15,100 45,112 45,88" fill="#6B4BA0"/>
  <!-- NW -->
  <polygon points="50,35 65,55 48,70" fill="#6B4BA0"/>

  <!-- Inner sun/core circle with rays -->
  <circle cx="100" cy="100" r="18" fill="none" stroke="#6B4BA0" stroke-width="3"/>

  <!-- 8 rays around center -->
  <line x1="100" y1="75" x2="100" y2="55" stroke="#6B4BA0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="118" y1="82" x2="133" y2="67" stroke="#6B4BA0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="125" y1="100" x2="145" y2="100" stroke="#6B4BA0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="118" y1="118" x2="133" y2="133" stroke="#6B4BA0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="125" x2="100" y2="145" stroke="#6B4BA0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="118" x2="67" y2="133" stroke="#6B4BA0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="100" x2="55" y2="100" stroke="#6B4BA0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="82" x2="67" y2="67" stroke="#6B4BA0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="100" cy="100" r="4" fill="#6B4BA0"/>
</svg>
